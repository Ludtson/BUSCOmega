<text x='44' y='384' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5c6657'><tspan font-weight='700' fill='#1c231d'>N&#8203;e proxy</tspan> = count-pooled dN/dS on each species' own branch (two-ratio branch model), with a gene-bootstrap CI.</text>
<text x='44' y='402' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5c6657'>Standard-library Python; MAFFT / PAL2NAL / codeml do the alignment and model fitting. Every stage: a timestamped log and a pass/drop manifest.</text>
<text x='44' y='420' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9' fill='#A8B0A4'>run_buscomega.py orchestrates all seven &#183; runs 3 to hundreds of taxa, any clade</text>
