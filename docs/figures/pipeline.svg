<text x='40' y='738' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#5c6657'>Every stage writes its own <tspan font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>stageN.log</tspan> (timestamp, params, tool version, elapsed) and a manifest of what passed and what dropped, with the reason.</text>
<text x='40' y='754' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10.5' fill='#5c6657'>Stdlib-only Python; runs from 3 to hundreds of taxa, any clade, any annotation source. Two-ratio branch model, one run per focal species.</text>
