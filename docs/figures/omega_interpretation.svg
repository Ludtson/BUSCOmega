<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 300'>
<rect width='720' height='300' fill='#ffffff'/>
<text x='28' y='27' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' fill='#1c231d'>Reading the Ne proxy: one pooled &#969; per lineage on a shared axis</text>
<text x='28' y='46' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11.5' fill='#5c6657'>Illustrative. Lower genome-wide &#969; = selection removes slightly-deleterious changes more efficiently = larger Ne.</text>
<line x1='90' y1='110' x2='610' y2='110' stroke='#5c6657' stroke-width='1.5'/><line x1='90' y1='106' x2='90' y2='114' stroke='#5c6657'/><text x='90' y='128' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9.5' fill='#5c6657' text-anchor='middle'>0.05</text><line x1='350.0' y1='106' x2='350.0' y2='114' stroke='#5c6657'/><text x='350' y='128' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9.5' fill='#5c6657' text-anchor='middle'>0.20</text><line x1='610.0' y1='106' x2='610.0' y2='114' stroke='#5c6657'/><text x='610' y='128' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9.5' fill='#5c6657' text-anchor='middle'>0.35</text><text x='82' y='100' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' fill='#2f6b4f' text-anchor='end'>&#8592; larger Ne</text><text x='618' y='100' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' fill='#a8432e'>smaller Ne &#8594;</text><text x='90' y='150' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#1c231d'>pilot &#8212; 3 Brassicaceae, &#969; all &#8776; 0.16</text>
<circle cx='286' cy='110' r='5' fill='#31607d'/><text x='286' y='100' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9' fill='#1c231d' text-anchor='middle'>a_hal</text>
<circle cx='298' cy='110' r='5' fill='#31607d'/><text x='298' y='100' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9' fill='#1c231d' text-anchor='middle'>a_tha</text>
<circle cx='265' cy='110' r='5' fill='#31607d'/><text x='265' y='100' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9' fill='#1c231d' text-anchor='middle'>c_gra</text>
<text x='624' y='114' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' fill='#5c6657'>CIs overlap &#8594;<tspan x='624' dy='12'>similar Ne</tspan></text>
<line x1='90' y1='210' x2='610' y2='210' stroke='#5c6657' stroke-width='1.5'/><line x1='90' y1='206' x2='90' y2='214' stroke='#5c6657'/><text x='90' y='228' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9.5' fill='#5c6657' text-anchor='middle'>0.05</text><line x1='350.0' y1='206' x2='350.0' y2='214' stroke='#5c6657'/><text x='350' y='228' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9.5' fill='#5c6657' text-anchor='middle'>0.20</text><line x1='610.0' y1='206' x2='610.0' y2='214' stroke='#5c6657'/><text x='610' y='228' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9.5' fill='#5c6657' text-anchor='middle'>0.35</text><text x='82' y='200' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' fill='#2f6b4f' text-anchor='end'>&#8592; larger Ne</text><text x='618' y='200' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' fill='#a8432e'>smaller Ne &#8594;</text><text x='90' y='250' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#1c231d'>hypothetical &#8212; a real Ne contrast</text>
<circle cx='194' cy='210' r='5' fill='#31607d'/><text x='194' y='200' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9' fill='#1c231d' text-anchor='middle'>sp A</text>
<circle cx='298' cy='210' r='5' fill='#31607d'/><text x='298' y='200' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9' fill='#1c231d' text-anchor='middle'>sp B</text>
<circle cx='523' cy='210' r='5' fill='#a8432e'/><text x='523' y='200' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='9' fill='#1c231d' text-anchor='middle'>sp C</text>
<text x='624' y='214' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' fill='#5c6657'>sp C spread out &#8594;<tspan x='624' dy='12'>smaller Ne in C</tspan></text>
<text x='28' y='286' font-family='ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' fill='#5c6657'>The bootstrap CI on each dot decides whether an apparent gap is real. In the pilot the CIs overlap; the result is “no detectable Ne difference among the three,” not three separate numbers to report.</text>
</svg>